name: Bryson joint-posterior pilot

on:
  push:
    branches:
      - agent/bryson-joint-posterior-preflight
    paths:
      - 'research/bryson-joint-posterior/**'
      - '.github/workflows/bryson-joint-posterior-pilot.yml'
  pull_request:
    paths:
      - 'research/bryson-joint-posterior/**'
      - '.github/workflows/bryson-joint-posterior-pilot.yml'
  workflow_dispatch:

concurrency:
  group: bryson-joint-posterior-pilot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pilot:
    name: Pilot ${{ matrix.branch }} completeness
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: constant
            seed: 2026081901
            contour: out_sc0_hab2_insol_teff_extrap_const.fits.gz
          - branch: zero
            seed: 2026081902
            contour: out_sc0_hab2_insol_teff.fits.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pinned numerical environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==1.23.5' \
            'scipy==1.10.1' \
            'pandas==1.5.3' \
            'astropy==5.3.4' \
            'emcee==3.1.6'
          python - <<'PY'
          import astropy, emcee, numpy, pandas, scipy
          print({
              'numpy': numpy.__version__,
              'scipy': scipy.__version__,
              'pandas': pandas.__version__,
              'astropy': astropy.__version__,
              'emcee': emcee.__version__,
          })
          PY

      - name: Sparse-checkout pinned Bryson inputs
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/stevepur/DR25-occurrence-public.git /tmp/DR25-occurrence-public
          cd /tmp/DR25-occurrence-public
          git sparse-checkout init --no-cone
          git sparse-checkout set \
            /insolation/rateModels3D.py \
            /insolation/koiCatalogs/PCs_dr25_hab2.csv \
            /stellarCatalogs/dr25_stellar_berger2020_clean_hab2.txt.zip
          git checkout d200f54b6f0df49e0dae530e69983cdce5397bfb
          test "$(git rev-parse HEAD)" = "d200f54b6f0df49e0dae530e69983cdce5397bfb"
          unzip -p stellarCatalogs/dr25_stellar_berger2020_clean_hab2.txt.zip \
            > stellarCatalogs/dr25_stellar_berger2020_clean_hab2.txt
          test -s stellarCatalogs/dr25_stellar_berger2020_clean_hab2.txt

      - name: Download authoritative completeness contour
        env:
          CONTOUR_NAME: ${{ matrix.contour }}
        run: |
          mkdir -p /tmp/DR25-occurrence-public/completenessContours/runtime
          python - <<'PY'
          import os
          import urllib.request
          from pathlib import Path

          name = os.environ['CONTOUR_NAME']
          url = f'https://stevepur.com/completenessContours/{name}'
          destination = Path('/tmp/DR25-occurrence-public/completenessContours/runtime') / name
          request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(request, timeout=900) as response, destination.open('wb') as output:
              while True:
                  block = response.read(1024 * 1024)
                  if not block:
                      break
                  output.write(block)
          if destination.stat().st_size < 100_000_000:
              raise RuntimeError(f'Completeness download unexpectedly small: {destination.stat().st_size}')
          print(destination, destination.stat().st_size)
          PY
          sha256sum "/tmp/DR25-occurrence-public/completenessContours/runtime/$CONTOUR_NAME"

      - name: Run seeded no-period-cutoff joint-posterior pilot
        env:
          BRANCH: ${{ matrix.branch }}
          SEED: ${{ matrix.seed }}
          CONTOUR_NAME: ${{ matrix.contour }}
        run: |
          OUT="$GITHUB_WORKSPACE/results/bryson-joint-posterior/$BRANCH"
          mkdir -p "$OUT"
          python research/bryson-joint-posterior/run_hab2_joint_posterior.py \
            --bryson-root /tmp/DR25-occurrence-public \
            --stellar-catalog /tmp/DR25-occurrence-public/stellarCatalogs/dr25_stellar_berger2020_clean_hab2.txt \
            --pc-catalog /tmp/DR25-occurrence-public/insolation/koiCatalogs/PCs_dr25_hab2.csv \
            --completeness "/tmp/DR25-occurrence-public/completenessContours/runtime/$CONTOUR_NAME" \
            --branch "$BRANCH" \
            --out "$OUT" \
            --seed "$SEED" \
            --trials 3 \
            --burnin 50 \
            --steps 120 \
            --thin 2 \
            --run-label pilot

      - name: Inspect pilot results
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          OUT="results/bryson-joint-posterior/$BRANCH"
          find "$OUT" -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort
          cat "$OUT/posterior_summary_${BRANCH}_pilot.json"
          cat "$OUT/trial_diagnostics_${BRANCH}_pilot.json"

      - uses: actions/upload-artifact@v4
        with:
          name: bryson-joint-posterior-pilot-${{ matrix.branch }}
          path: results/bryson-joint-posterior/${{ matrix.branch }}/
          if-no-files-found: error
          retention-days: 14
