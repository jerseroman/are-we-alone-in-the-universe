name: Metallicity-dependent TAMS sensitivity

on:
  pull_request:
    paths:
      - 'research/jj-host-export/**'
      - '.github/workflows/jj-tams-metallicity-sensitivity.yml'

permissions:
  contents: read

jobs:
  metallicity-tams:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pinned-compatible dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.23.5' 'scipy==1.10.1' 'astropy==5.3.4' 'matplotlib==3.7.5' 'fast-histogram==0.14' 'requests>=2.28'

      - name: Checkout official JJ model at pinned commit
        run: |
          git clone https://github.com/askenja/jjmodel.git /tmp/jjmodel-src
          cd /tmp/jjmodel-src
          git checkout 2828a2e8bfc379ba9c8ef4b4d0477ab5febe3b54
          python -m pip install -e .
          git rev-parse HEAD

      - name: Download official JJ Padova/PARSEC isochrones
        run: |
          python - <<'PY'
          from jjmodel.iso_loader import isochrone_loader
          isochrone_loader('Padova', photometry='multiband')
          PY

      - name: Prepare canonical JJ dR=0.5 configuration
        run: |
          mkdir -p /tmp/jj-metal-run results/metallicity-tams
          cp /tmp/jjmodel-src/jjmodel/tutorials/tutorial2/parameters /tmp/jj-metal-run/parameters
          cp /tmp/jjmodel-src/jjmodel/tutorials/tutorial2/sfrd_peaks_parameters /tmp/jj-metal-run/sfrd_peaks_parameters
          cp /tmp/jj-metal-run/parameters /tmp/jj-metal-run/parameters.original
          sed -E -i 's/^(Rmin[[:space:]]+)4([[:space:]])/\14.0\2/' /tmp/jj-metal-run/parameters
          sed -E -i 's/^(Rmax[[:space:]]+)14([[:space:]])/\114.0\2/' /tmp/jj-metal-run/parameters
          sed -E -i 's/^(dR[[:space:]]+)1([[:space:]])/\10.5\2/' /tmp/jj-metal-run/parameters
          sed -i 's/float(p.dR) == 1.0/float(p.dR) == 0.5/' research/jj-host-export/run_jj_export.py
          sed -i 's/JJ 1-kpc grid/JJ 0.5-kpc grid/' research/jj-host-export/run_jj_export.py
          grep -E '^(Rmin|Rmax|dR)[[:space:]]' /tmp/jj-metal-run/parameters

      - name: Regenerate JJ stellar assemblies
        run: |
          python research/jj-host-export/run_jj_export.py \
            --jj-root /tmp/jjmodel-src \
            --run-dir /tmp/jj-metal-run \
            --out "$GITHUB_WORKSPACE/results/metallicity-tams" \
            --iso Padova

      - name: Export exact pre-logg parent population with FeH
        run: |
          python research/jj-host-export/tams_ab_test.py \
            --jj-root /tmp/jjmodel-src \
            --run-dir /tmp/jj-metal-run \
            --out "$GITHUB_WORKSPACE/results/metallicity-tams" \
            --iso Padova
          python - <<'PY'
          import csv
          p='results/metallicity-tams/jj_g_hosts_parent_prelogg_padova.csv'
          with open(p,newline='',encoding='utf-8') as f:
              r=csv.DictReader(f)
              assert 'FeH' in r.fieldnames, r.fieldnames
              rows=list(r)
          print('PARENT_FEH_PASS', len(rows), min(float(x['FeH']) for x in rows), max(float(x['FeH']) for x in rows))
          PY

      - name: Build metallicity-dependent PARSEC TAMS and recompute L0-L2
        run: |
          python research/jj-host-export/metallicity_tams_sensitivity.py \
            --input "$GITHUB_WORKSPACE/results/metallicity-tams/jj_g_hosts_parent_prelogg_padova.csv" \
            --reference-tams "$GITHUB_WORKSPACE/research/jj-host-export/reference-data/tams_parsec_danxhuber.txt" \
            --cache /tmp/parsec-metallicity-tracks \
            --out "$GITHUB_WORKSPACE/results/metallicity-tams"
          cat results/metallicity-tams/metallicity_tams_sensitivity.json

      - name: Record provenance and hashes
        run: |
          cp /tmp/jj-metal-run/parameters.original results/metallicity-tams/JJ_tutorial2_parameters_original.txt
          cp /tmp/jj-metal-run/parameters results/metallicity-tams/JJ_tutorial2_parameters_runtime.txt
          cat > results/metallicity-tams/METALLICITY_TAMS_PROVENANCE.md <<'EOF'
          # Metallicity-dependent PARSEC-TAMS sensitivity

          - Purpose: quantify the host-selection systematic from applying the one-dimensional Berger/Huber Z=0.017 TAMS boundary to a JJ thin+thick-disk population with row-level metallicity variation.
          - Canonical baseline is unchanged; this workflow is sensitivity-only.
          - JJ: `askenja/jjmodel` commit `2828a2e8bfc379ba9c8ef4b4d0477ab5febe3b54`, official tutorial2 configuration, dR=0.5 kpc, Padova/PARSEC multiband isochrones.
          - Parent rows preserve JJ `FeH`, assigned from the JJ AMR during stellar-assembly construction.
          - PARSEC v1.2S evolutionary tracks: public SISSA/PARSEC `CAF09_V1.2S_M36_LT` metallicity archives.
          - TAMS extraction deliberately follows `danxhuber/evolstate` `parsec.py`: first track row with `PHASE == 7` and age <20 Gyr; radius reconstructed from LOG_L and LOG_TE using T_sun=5777 K.
          - The regenerated Z=0.017 curve must reproduce the immutable Berger/Huber TAMS table before the metallicity-dependent calculation is accepted.
          - PARSEC metallicity convention: scaled solar, Y=0.2485+1.78Z and [M/H]=log10((Z/X)/(Z/X)_sun), (Z/X)_sun=0.0207.
          - Interpolation: linear in Teff and log10(R_TAMS) within a Z curve; then linear in [M/H] and log10(R_TAMS) between metallicity anchors. Extrapolation is forbidden.
          - Host selector compared: canonical 1-D TAMS versus metallicity-dependent 2-D TAMS, both with the same logg<7 compact-remnant veto.
          - Occurrence/HZ weights are unchanged from the frozen canonical branch; only host evolutionary-state selection changes.
          EOF
          sha256sum results/metallicity-tams/* | sort > results/metallicity-tams/SHA256SUMS_all.txt

      - uses: actions/upload-artifact@v4
        with:
          name: metallicity-dependent-tams-sensitivity
          path: results/metallicity-tams/
          if-no-files-found: error
          retention-days: 14
