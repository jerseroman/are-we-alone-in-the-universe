# CI for "Are We Alone in the Universe? Earth-like Planet Calculator" (v2.18+).
# Version-neutral pipeline: `npm run test:all` is the stable release gate.
# The deeper `test:absolute` and `test:deep` audits can be run locally;
# see REPRODUCIBILITY.md for the full verification instructions.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Static site verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run stable test suite
        run: npm run test:all

      - name: Verify static site
        run: node tools/verify-static-site.mjs

      - name: Check JavaScript syntax
        run: node tools/check-syntax.mjs
