name: Bryson full joint-posterior reconstruction gate

on:
  pull_request:
    paths:
      - '.github/workflows/bryson-joint-posterior-production.yml'
  workflow_dispatch:

# This group intentionally matches the former production workflow.  Updating
# this gate cancels any stale in-progress reconstruction that used the obsolete
# 400-day period cut.  A new full workflow will be enabled only after the
# no-period-cutoff pilot has passed for both completeness branches.
concurrency:
  group: bryson-full-joint-posterior-reconstruction
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gated:
    runs-on: ubuntu-22.04
    steps:
      - name: Hold publication-scale reconstruction pending pilot validation
        run: |
          cat <<'EOF'
          Full reconstruction is intentionally gated.

          Required before enabling production:
          1. constant-completeness no-period-cutoff pilot succeeds;
          2. zero-completeness no-period-cutoff pilot succeeds;
          3. parameter ordering is verified against archived medians;
          4. trial-level MCMC diagnostics are reviewed.

          No posterior result is produced by this gate.
          EOF
