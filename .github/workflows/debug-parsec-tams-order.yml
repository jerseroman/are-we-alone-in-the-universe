name: Debug PARSEC TAMS ordering
on:
  pull_request:
    paths:
      - 'research/jj-host-export/debug_parsec_tams_order.py'
      - '.github/workflows/debug-parsec-tams-order.yml'
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: python -m pip install 'numpy==1.23.5' 'astropy==5.3.4' 'requests>=2.28'
      - name: Compare archive and lexical ordering
        run: |
          mkdir -p results/tams-order-debug
          python research/jj-host-export/debug_parsec_tams_order.py \
            --reference research/jj-host-export/reference-data/tams_parsec_danxhuber.txt \
            --out results/tams-order-debug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tams-order-debug
          path: results/tams-order-debug/
          if-no-files-found: warn
          retention-days: 2
