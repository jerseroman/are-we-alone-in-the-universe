name: JJ G-host dR=0.5 + TAMS validation

on:
  pull_request:
    paths:
      - 'research/jj-host-export/**'
      - '.github/workflows/jj-g-host-export.yml'

permissions:
  contents: read

jobs:
  jj-export:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pinned-compatible Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.23.5' 'scipy==1.10.1' 'astropy==5.3.4' 'matplotlib==3.7.5' 'fast-histogram==0.14' 'requests>=2.28'

      - name: Checkout official JJ model at pinned commit
        run: |
          git clone https://github.com/askenja/jjmodel.git /tmp/jjmodel-src
          cd /tmp/jjmodel-src
          git checkout 2828a2e8bfc379ba9c8ef4b4d0477ab5febe3b54
          python -m pip install -e .
          git rev-parse HEAD

      - name: Download official Padova/PARSEC JJ isochrone archive
        run: |
          python - <<'PY'
          from jjmodel.iso_loader import isochrone_loader
          isochrone_loader('Padova', photometry='multiband')
          PY

      - name: Prepare official JJ tutorial2 configuration at dR=0.5 kpc
        run: |
          mkdir -p /tmp/jj-run
          cp /tmp/jjmodel-src/jjmodel/tutorials/tutorial2/parameters /tmp/jj-run/parameters
          cp /tmp/jjmodel-src/jjmodel/tutorials/tutorial2/sfrd_peaks_parameters /tmp/jj-run/sfrd_peaks_parameters
          cp /tmp/jj-run/parameters /tmp/jj-run/parameters.original
          sed -E -i 's/^(Rmin[[:space:]]+)4([[:space:]])/\14.0\2/' /tmp/jj-run/parameters
          sed -E -i 's/^(Rmax[[:space:]]+)14([[:space:]])/\114.0\2/' /tmp/jj-run/parameters
          sed -E -i 's/^(dR[[:space:]]+)1([[:space:]])/\10.5\2/' /tmp/jj-run/parameters
          grep -E '^(Rmin|Rmax|dR)[[:space:]]' /tmp/jj-run/parameters
          sed -i 's/float(p.dR) == 1.0/float(p.dR) == 0.5/' research/jj-host-export/run_jj_export.py
          sed -i 's/JJ 1-kpc grid/JJ 0.5-kpc grid/' research/jj-host-export/run_jj_export.py
          mkdir -p results/jj

      - name: Generate JJ stellar assemblies and export G hosts
        run: |
          python research/jj-host-export/run_jj_export.py \
            --jj-root /tmp/jjmodel-src \
            --run-dir /tmp/jj-run \
            --out "$GITHUB_WORKSPACE/results/jj" \
            --iso Padova

      - name: Export row-level eligible JJ hosts
        run: |
          python research/jj-host-export/export_raw_eligible.py \
            --jj-root /tmp/jjmodel-src \
            --run-dir /tmp/jj-run \
            --out "$GITHUB_WORKSPACE/results/jj" \
            --iso Padova

      - name: Run PARSEC-TAMS A/B main-sequence validation
        run: |
          python research/jj-host-export/tams_ab_test.py \
            --jj-root /tmp/jjmodel-src \
            --run-dir /tmp/jj-run \
            --out "$GITHUB_WORKSPACE/results/jj" \
            --iso Padova
          cat results/jj/tams_ab_results.json

      - name: Record exact provenance
        run: |
          cp /tmp/jj-run/parameters.original results/jj/JJ_tutorial2_parameters_original.txt
          cp /tmp/jj-run/parameters results/jj/JJ_tutorial2_parameters_runtime.txt
          cp /tmp/jj-run/sfrd_peaks_parameters results/jj/JJ_tutorial2_sfr_peaks_parameters.txt
          sha256sum results/jj/* | sort > results/jj/SHA256SUMS_all.txt
          cat > results/jj/PROVENANCE.md <<'EOF'
          # JJ G-dwarf dR=0.5 and PARSEC-TAMS validation provenance

          - JJ code: `askenja/jjmodel`, commit `2828a2e8bfc379ba9c8ef4b4d0477ab5febe3b54` (v1.0.1).
          - Official tutorial2 SFH/IMF/AMR configuration; only radial numerical resolution changed to dR=0.5 kpc.
          - Official JJ Padova/PARSEC multiband isochrones, heiDATA DOI `10.11588/data/ZCXHOE`.
          - Parent A/B sample: 5300 <= Teff <= 6000 K; age >= 4.57 Gyr; thin+thick disk; no pre-applied logg cut.
          - Selection A: legacy 4.3 < logg < 7.0.
          - Selection B: Rstar <= interpolated public PARSEC TAMS radius boundary used by Berger/Huber evolstate.
          - Primary radius reconstruction: R/Rsun = sqrt(Mf * 10^(logg_sun-logg)), logg_sun=4.438.
          - Independent radius check: R/Rsun = 10^(logL/2)*(5772/Teff)^2.
          - L1/L2 use the same frozen Bryson Model 1 hab2 constant-completeness + Kopparapu conservative HZ equations as the deterministic verifier.
          - No extra metallicity, P_evol, SFR, SN, or Lineweaver probability multiplier is applied.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: jj-g-host-export-padova-dr05-tams
          path: results/jj/
          if-no-files-found: error
          retention-days: 14
